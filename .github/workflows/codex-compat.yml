name: Codex CLI compatibility

# Checks the newest Codex CLI release (or a chosen one) against the argv this
# server builds and the output it parses, on every platform, with no credentials
# and no quota (#99). The CLI ships several releases a week; a scheduled run is
# what notices when one of them breaks this server. What needs an authenticated
# run — the event stream, the session file, `login status` — stays with
# `/smoke-test`. See scripts/check-codex-compat.ts.

on:
  schedule:
    - cron: "17 7 * * *"
  # A change to what is checked is checked against the latest release before it merges.
  pull_request:
    branches: [main]
    paths:
      - "src/codex/args.ts"
      - "src/codex/catalog.ts"
      - "src/codex/doctor.ts"
      - "scripts/check-codex-compat.ts"
      - ".github/workflows/codex-compat.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Codex CLI version to check (default: the latest on npm)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-compat
  cancel-in-progress: false

jobs:
  compat:
    name: Codex CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Installed into a scratch prefix, not globally: the check runs the
      # platform package's native binary, never the npm wrapper or a .cmd shim.
      - name: Install the Codex CLI
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(npm view @openai/codex version)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a Codex CLI version: $version" >&2
            exit 1
          fi
          npm install --prefix "$RUNNER_TEMP/codex" --no-save --no-audit --no-fund "@openai/codex@$version"

      - name: Check compatibility
        shell: bash
        run: node --import tsx scripts/check-codex-compat.ts "$RUNNER_TEMP/codex"
