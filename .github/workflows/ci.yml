name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to check out; defaults to the triggering commit
        required: false
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run on the same branch is wasted compute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Node versions are exercised on Linux, which is the cheapest runner:
        # 22 is the floor declared in package.json engines (the oldest Node line
        # not yet end-of-life; see docs/VERSIONING.md), 24 is what the project is
        # developed against, and 26 is what a desktop app launched from the Dock
        # would pick up on a machine with Homebrew's Node.
        #
        # The other platforms get one Node version each: the risk they carry is
        # the operating system, not the runtime.
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          # Windows runs on the engines floor because npm scripts go through
          # cmd.exe there, which expands no globs and has no rm. Node 22's --test
          # can expand a pattern itself, but the suite must not rely on either.
          - os: windows-latest
            node: "22"
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The unit tests never invoke the Codex CLI, which is not installed here.
      # This asserts that: a server that shelled out during startup would hang
      # or fail, and the CI runner is the only place that difference shows up.
      - name: Verify the server starts without the Codex CLI
        run: node scripts/check-startup.mjs

      # On Windows, spawn without a shell does not resolve .cmd shims, which is
      # exactly what a global npm install of the Codex CLI produces there. This
      # puts a fake Codex on PATH and asserts the preflight finds it, so the
      # failure shows up here rather than as "Codex is not installed" on a
      # machine where it plainly is.
      - name: Verify the preflight resolves a Codex CLI on PATH
        run: node scripts/check-codex-resolution.mjs

  package:
    name: Verify the published package contents
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build

      # Catches the classic packaging mistake: publishing sources without the
      # build output, or shipping tests and scratch files to every consumer.
      - name: Inspect the tarball
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const required = ['build/index.js', 'package.json', 'README.md', 'LICENSE'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('Missing from the tarball:', missing); process.exit(1); }
            const leaked = files.filter(f => f.startsWith('test/') || f.startsWith('src/') || f === '.mcp.json');
            if (leaked.length) { console.error('Should not be published:', leaked); process.exit(1); }
            console.log('Tarball contains', files.length, 'files; all required entries present.');
          "

      # Inspecting the tarball's file list does not prove the package works once
      # installed. This installs it the way a consumer would and starts the
      # binary, which is what catches a broken bin entry or a missing shebang.
      - name: Install the tarball and start the server
        run: |
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP/$TARBALL"
          node "$GITHUB_WORKSPACE/scripts/check-startup.mjs" ./node_modules/.bin/codex-subagent
