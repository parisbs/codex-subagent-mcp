# Squash merging makes the pull request title the commit on main, so the title
# is what must follow Conventional Commits. No third-party action: the check is
# a regular expression over a value passed through the environment, never
# interpolated into the script. The description must start with a non-space
# character, and a title with a line break is rejected outright.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*$'
          case "$TITLE" in
            *$'\n'* | *$'\r'*) valid=no ;;
            *) if printf '%s' "$TITLE" | grep -Eq "$pattern"; then valid=yes; else valid=no; fi ;;
          esac
          if [ "$valid" = yes ]; then
            echo "Title follows Conventional Commits."
          else
            echo "Title must be one line following Conventional Commits, for example: feat(scope): add something"
            echo "Got: $TITLE"
            exit 1
          fi
